###############################################################################
# PXC 운영용 비밀번호 7종.
# - root: SQL root 접속
# - xtrabackup: 백업 도구가 노드 간 데이터 sync에 사용
# - monitor: HAProxy/ProxySQL 헬스체크용
# - clustercheck: clustercheck.sh가 사용
# - proxyadmin: ProxySQL admin
# - operator: Operator가 클러스터 reconcile에 사용
# - replication: Galera replication
#
# ⚠️ 모두 평문 — 데모용. 운영 시 SealedSecret/ExternalSecrets로 교체 필수.
###############################################################################

apiVersion: v1
kind: Secret
metadata:
  name: kosa-pxc-secrets
  namespace: pii-protected
type: Opaque
stringData:
  root: rootpass123!
  xtrabackup: xtrapass123!
  monitor: monpass123!
  clustercheck: checkpass123!
  proxyadmin: adminpass123!
  operator: oppass123!
  replication: replpass123!
