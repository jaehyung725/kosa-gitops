###############################################################################
# ticket-app이 PXC ProxySQL에 연결할 때 사용할 DB 자격증명.
# PXC 안에선 별도로 `kosa_app` 유저 생성 + `kosa_tickets` DB 생성 필요
# (수동 mysql 명령 또는 ConfigMap의 init script).
###############################################################################

apiVersion: v1
kind: Secret
metadata:
  name: ticket-db-credentials
  namespace: kosa-tickets
type: Opaque
stringData:
  DATABASE_HOST: kosa-pxc-proxysql.pii-protected.svc.cluster.local
  DATABASE_PORT: "3306"
  DATABASE_USER: kosa_app
  DATABASE_PASSWORD: kosa1004
  DATABASE_DB_NAME: kosa_tickets
