# ceph-csi가 RBD 이미지를 만들고 마운트할 때 이 keyring으로 Ceph에 인증.
#
# 값은 ceph 클러스터에서 발급:
#   ceph auth get-or-create client.team2-k8s-csi \
#     mon 'profile rbd' \
#     osd 'profile rbd pool=team2-k8s-pvc-rbd' \
#     mgr 'profile rbd pool=team2-k8s-pvc-rbd'
#
# ⚠️ Private repo라 평문이지만, 운영 단계에선 SealedSecret 권장
###############################################################################

